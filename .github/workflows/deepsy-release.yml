# Synchronize source, validate the desktop, then publish the exact tested commit.
name: deepsy-release

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report pending upstream source updates without merging or publishing.
        type: boolean
        default: false
      release-current:
        description: Publish the current master version without fetching new upstream source.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deepsy-release
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  release:
    if: github.repository == 'Howell5/deepsy' && github.ref == 'refs/heads/master'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Synchronize upstream source
        id: decision
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          RELEASE_CURRENT: ${{ inputs.release-current }}
        run: |
          git config user.name 'deepsy-release[bot]'
          git config user.email 'deepsy-release[bot]@users.noreply.github.com'
          ARGS=()
          if [[ "$DRY_RUN" == "true" ]]; then ARGS+=(--dry-run); fi
          if [[ "$RELEASE_CURRENT" == "true" ]]; then ARGS+=(--release-current); fi
          node --import tsx/esm scripts/deepsy-update/sync-upstream.ts "${ARGS[@]}"

      - name: Install synchronized dependencies
        if: steps.decision.outputs.sourceChanged == 'true' && inputs.dry-run != true
        run: pnpm install --no-frozen-lockfile

      - name: Check desktop integration
        if: steps.decision.outputs.updateAvailable == 'true' && inputs.dry-run != true
        run: |
          pnpm exec vitest run scripts/deepsy-update apps/desktop/tests packages/widget packages/client/ui-widgets
          pnpm run test:gui
          pnpm run doc-sync
          pnpm run lint
          pnpm run constraints

      - name: Build desktop artifacts
        if: steps.decision.outputs.updateAvailable == 'true' && inputs.dry-run != true
        run: |
          pnpm run build:desktop
          pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/built-boot.expected.e2e.ts apps/web/tests/shipped-composition.e2e.ts
          pnpm --filter @deepseek-ai/dsh-desktop run package
          pnpm --filter @deepseek-ai/dsh-desktop run smoke

      - name: Commit and push validated source
        if: steps.decision.outputs.sourceChanged == 'true' && inputs.dry-run != true
        env:
          TARGET: ${{ steps.decision.outputs.target }}
        run: |
          git add -u
          git diff --cached --check
          git commit -m "chore(desktop): synchronize upstream and release $TARGET"
          # A concurrent master update rejects this ordinary fast-forward push.
          git push origin HEAD:master

      - name: Publish desktop release
        if: steps.decision.outputs.updateAvailable == 'true' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.decision.outputs.target }}
        run: |
          COMMIT="$(git rev-parse HEAD)"
          TAG="v$TARGET"
          URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          if gh release view "$TAG" --json isDraft --jq .isDraft > release-draft.txt 2>/dev/null; then
            if [[ "$(cat release-draft.txt)" != "true" ]]; then
              echo "Release $TAG is already published; refusing to replace its assets."
              exit 1
            fi
            DRAFT_TARGET="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
            test "$DRAFT_TARGET" = "$COMMIT"
          else
            gh release create "$TAG" --target "$COMMIT" --title "$TARGET" --generate-notes --draft
          fi
          node --import tsx/esm scripts/deepsy-update/write-latest-json.ts \
            --version="$TARGET" --release-url="$URL" \
            --output=apps/desktop/dist/release/latest.json
          gh release upload "$TAG" apps/desktop/dist/release/*.dmg \
            apps/desktop/dist/release/*.zip apps/desktop/dist/release/latest.json --clobber
          if [[ "$TARGET" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
          echo "Published [$TARGET]($URL) from $COMMIT" >> "$GITHUB_STEP_SUMMARY"
